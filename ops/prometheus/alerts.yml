# Prometheus alert rules for the Drogon blog.
#
# Thresholds tuned for a small single-instance deployment (CV-grade project,
# not a fleet). They favour signal over silence: alerts fire on conditions
# that an operator should look at within minutes, and stay quiet for the
# kind of bursty traffic patterns a small blog will see.

groups:
  - name: blog-availability
    interval: 30s
    rules:
      - alert: BlogDown
        # `up` is 1 when Prometheus successfully scraped the target in the
        # last interval, 0 otherwise. 1 minute = two missed scrapes at 15s.
        expr: up{job="blog"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Blog target is not reachable
          description: |
            Prometheus has not scraped {{ $labels.instance }} for 1 minute.
            Either the systemd unit died or /metrics started returning 401.

      - alert: BlogRestartLoop
        # Restart=on-failure in the unit means a crash comes straight back
        # up, so a crashloop and a healthy service look identical from the
        # outside: `up` never drops long enough for BlogDown to fire and the
        # site answers between crashes. Uptime resetting repeatedly is the
        # only signal that separates them.
        expr: blog_uptime_seconds < 600 and changes(blog_uptime_seconds[30m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Blog process is restart-looping
          description: |
            Uptime has reset more than three times in half an hour.
            `journalctl -u drogon-blog` will have the reason; a crash during
            startup (bad migration, missing env var) is the usual cause.

      - alert: BlogHighErrorRate
        # 5xx ratio over the last 5 minutes. We accept the occasional 5xx
        # (e.g. transient DB blip) but anything sustained > 1% is on us.
        expr: |
          (
            sum(rate(blog_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(blog_http_requests_total[5m])), 0.01)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            5xx error rate above 1% for 5 minutes
            ({{ humanizePercentage $value }})
          description: |
            Look at recent journalctl logs for the blog service. Likely
            culprits: DB connection pool starvation, an unhandled exception
            in a controller, or an upstream (SMTP / Cloudflare) timing out.

  - name: blog-latency
    interval: 30s
    rules:
      - alert: BlogHighP99Latency
        # histogram_quantile against the seconds histogram. Threshold is 1s
        # — generous for a public web app with DB+template rendering, but
        # anything beyond that on a small dataset signals a slow query or
        # contention on the worker thread pool.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(blog_http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p99 request latency > 1s for 10 minutes
          description: |
            Probably a slow PostgreSQL query (check pg_stat_statements) or
            an unbounded scan that lost its index after a migration.

  - name: blog-workers
    interval: 30s
    rules:
      - alert: BlogEmailQueueBackup
        # The in-process EmailHelper queue. Anything > 100 sustained means
        # the SMTP relay is rejecting / slow and verification mail is
        # backing up.
        expr: blog_email_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbound email queue depth > 100
          description: |
            Investigate mailcow / Postfix relay health. Users trying to
            register or reset passwords are currently waiting longer than
            they should for verification mail.

      - alert: BlogWorkerPoolShedding
        # The pools in front of Argon2id and libvips refuse work rather than
        # queue it without bound, so a rejection is a 503 handed to a real
        # person — a login or an image upload that did not happen. This is
        # distinct from BlogHighInFlight: that one catches the event loops
        # saturating, this one catches the blocking pools behind them.
        expr: increase(blog_worker_pool_rejected_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Worker pool {{ $labels.pool }} is refusing jobs
            ({{ $value }} in 10m)
          description: |
            Either the pool is undersized for current load (BLOG_AUTH_WORKERS
            defaults to 4, BLOG_MEDIA_WORKERS to 2) or something inside it has
            stopped completing and the backlog is not draining.

      - alert: BlogHighInFlight
        # If many requests pile up in-flight, the event loop is saturated.
        # Drogon's default worker count is ~CPU; > 100 concurrent means we
        # are either being slow-DoSed or have an upstream pinning workers.
        expr: blog_http_requests_in_flight > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: In-flight HTTP requests > 100
          description: |
            Check for slow downstream calls (DB, SMTP, libvips on huge
            uploads) or an attacker tying up workers with slowloris-style
            traffic.

      - alert: BlogRateLimiterCardinalityChurn
        expr: increase(blog_rate_limit_capacity_evictions_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Rate-limit cache reached its cardinality ceiling
          description: |
            New limiter keys are evicting old ones. This is abnormal for the
            blog's traffic and usually means IP/username rotation intended to
            consume memory or reset per-key budgets. Inspect access-log source
            diversity and Cloudflare events before raising the fixed ceiling.

      - alert: BlogWebSocketPolicyAbuse
        expr: |
          increase(blog_ws_connection_rejected_total[10m])
          + increase(blog_ws_policy_closure_total[10m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: WebSocket resource limits are rejecting clients
          description: |
            More than ten sockets were refused or policy-closed in ten
            minutes. Check whether one account/session is opening excessive
            tabs or sending oversized/high-rate control frames.

      - alert: BlogObservabilityInputAbuse
        expr: increase(blog_observability_input_truncated_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Oversized or high-cardinality observability input detected
          description: |
            A log/trace/Sentry field was replaced with a bounded digest, or
            an unsafe route was collapsed to /__unmatched__. Inspect access
            logs and Cloudflare events for long random paths or headers.

  - name: blog-resources
    interval: 1m
    rules:
      - alert: BlogMemoryGrowth
        # 1.5 GiB on this VPS = we are leaking something. Normal steady
        # state is ~80–150 MiB.
        expr: blog_process_resident_memory_bytes > 1.5e9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Blog RSS above 1.5 GiB for 15 minutes
          description: |
            Suspect an upload pipeline leak (libvips images, message
            attachments) or a slow leak from the request handlers. Dump
            with `gcore $(pidof blog)` and inspect.
