# Grafana provisioning: load any dashboard JSON dropped into the mounted
# dashboards directory. Lets `git pull` ship new/updated dashboards without
# manual import.
apiVersion: 1

providers:
  - name: blog
    orgId: 1
    folder: Blog
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
