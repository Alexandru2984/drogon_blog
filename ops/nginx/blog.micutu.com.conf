# Reference copy of the live vhost: /etc/nginx/sites-enabled/blog.micutu.com
#
# This file is documentation, not a deployment artifact — nginx does not read
# it. It is tracked because the two things this vhost gets right were both
# discovered the hard way in production and were, until now, recorded nowhere:
#
#   * `listen [::]:443 ssl;`  — without it the server block does not exist for
#     an IPv6 client, and nginx falls through to whichever other vhost is
#     default for [::]:443, which answered 403/404 for every path.
#
#   * `upstream blog_backend_ws` — a WebSocket upgrade cannot be sent over a
#     pooled keep-alive connection, so /ws/ needs an upstream of its own.
#
# Note that /etc/nginx/sites-enabled/blog.micutu.com is a REGULAR FILE, not a
# symlink into sites-available: the two copies have diverged, and editing
# sites-available changes nothing. Edit sites-enabled, `nginx -t`, reload, and
# copy the result back here.
#
# Certificate paths are Certbot-managed and host-specific.

# nginx → Drogon. Upstream block adds keep-alive so we don't pay a TCP
# handshake on every request — that was the dominant cost in the
# origin-direct bench (32 ms RTT vs ~1.5 ms Drogon latency_ms).
upstream blog_backend {
    server 127.0.0.1:8092;
    keepalive 64;             # idle conns to keep open per worker
    keepalive_requests 10000; # max requests per conn before rotation
    keepalive_timeout 60s;
}

# Second upstream to the same Drogon, deliberately WITHOUT keepalive, used
# only by `location /ws/`.
#
# A WebSocket upgrade cannot be sent over a pooled connection. nginx hands
# the /ws/ location a connection from blog_backend's keepalive pool — one
# that has already served ordinary requests, where blog-proxy.conf sets
# `Connection ""` — and the upgrade fails on it: Drogon sees a request that
# is not a valid handshake on a path it only knows as a WebSocket route and
# answers 404.
#
# The failure rate is the pool's hit rate, which is why this looked
# intermittent and why it got worse the busier the site was. Measured on
# this host: 20/20 handshakes succeeded when nothing else was talking to
# nginx, and 4/20 when ordinary requests ran alongside them. Production
# traffic keeps the pool warm permanently, so live features were failing
# for real users far more often than any manual probe suggested.
#
# No keepalive here costs one TCP handshake to localhost per WebSocket —
# paid once per connection, not per message, against a connection that then
# lives for as long as the tab is open.
upstream blog_backend_ws {
    server 127.0.0.1:8092;
}

server {
    include snippets/block-dotfiles.conf;
    include snippets/blog-security.conf;
    server_name blog.micutu.com;

    client_max_body_size 8m;  # allow post-image / avatar uploads
    # WebSocket endpoint. Needs its own location: blog-proxy.conf blanks
    # Connection for upstream keep-alive, which strips the upgrade and makes
    # Drogon answer 404 for a path it only knows as a WebSocket route.
    location /ws/ {
        proxy_pass http://blog_backend_ws;
        include snippets/blog-ws-upgrade.conf;
    }

    # Vite stamps a content hash into every filename under /assets/, so a
    # given URL's bytes can never change — a rebuild produces new names and
    # index.html (which is never cached) points at them. That makes these
    # safely immutable, but Drogon sends `Expires: Thu, 01 Jan 1970` and no
    # Cache-Control, which reads as "already stale" to everyone: Cloudflare
    # answered BYPASS and browsers re-fetched on every visit, so all eight
    # bundles came off the origin for every page load, first visit or not.
    #
    # proxy_hide_header drops Drogon's epoch Expires; without it both headers
    # travel and the stricter one wins.
    location /assets/ {
        proxy_pass http://blog_backend;
        include snippets/blog-proxy.conf;
        proxy_hide_header Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://blog_backend;
        include snippets/blog-proxy.conf;
    }

    # replaced by blog-security.conf (stricter, app-specific)
    listen 443 ssl; # managed by Certbot
    # IPv6. Without this the block simply does not exist for an IPv6
    # client: nginx falls back to whichever other vhost is the default
    # for [::]:443 and that one answers 403/404 for every path here.
    # Cloudflare reaches the origin over either family, so the symptom
    # was intermittent — the same request 101 one second and 404 the
    # next, with the 404s never reaching the app at all.
    listen [::]:443 ssl;
    include snippets/blog-robots.conf;
    ssl_certificate /etc/letsencrypt/live/blog.micutu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.micutu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    include snippets/block-dotfiles.conf;
    if ($host = blog.micutu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name blog.micutu.com;
    return 404; # managed by Certbot
}
