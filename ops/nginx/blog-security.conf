# Security configuration for the blog vhost, included from the 443 server block.
# Canonical copy lives here in the repo; deploy with:
#   sudo cp ops/nginx/blog-security.conf   /etc/nginx/snippets/blog-security.conf
#   sudo cp ops/nginx/blog-proxy.conf      /etc/nginx/snippets/blog-proxy.conf
#   sudo cp ops/nginx/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#   # in the vhost: replace `include snippets/security-headers.conf;`
#   #               with    `include snippets/blog-security.conf;`
#   #               and inside `location /`, replace the inline
#   #               proxy_set_header lines with
#   #                       `include snippets/blog-proxy.conf;`
#   #               and replace `include snippets/robots.conf;`
#   #               with        `include snippets/blog-robots.conf;`
#   sudo nginx -t && sudo systemctl reload nginx
#
# This vhost does NOT use the shared snippets/security-headers.conf: the blog
# needs a stricter, app-specific policy (no script unsafe-inline, the Umami
# analytics origin whitelisted, frame-deny, COOP/CORP). Keeping it here avoids
# weakening the 36 other vhosts that share the generic snippet.

# ---------------------------------------------------------------------------
# Client IP resolution
# ---------------------------------------------------------------------------
# The app rate-limits per client IP and stamps that IP into the access log and
# the audit trail. It learns the IP from a header, because the only peer it
# ever sees is nginx on loopback. That makes the header a security boundary,
# and it was not being enforced as one: nginx forwards request headers to the
# upstream verbatim unless told otherwise, so a client that reached the origin
# directly could simply send its own `CF-Connecting-IP` and the app believed
# it. Reproduced against production before this change — two requests carrying
# forged TEST-NET addresses were logged as coming from those addresses.
#
# The consequence was a full bypass of every per-IP budget: a fresh header
# value means a fresh token bucket, so /auth/register, /auth/request-reset and
# /posts/search had no effective limit, and both the access log and the audit
# log could be filled with attacker-chosen origins.
#
# The fix has two halves, and neither lives in this file.
#
# 1. Deciding which peers may speak for someone else is host-wide policy,
#    so it sits at http level in /etc/nginx/conf.d/cloudflare-realip.conf
#    (canonical copy: ops/nginx/cloudflare-realip.conf, regenerated by
#    scripts/update-cloudflare-ips.sh). It runs the real_ip module over
#    Cloudflare's published ranges, so $remote_addr is rewritten from
#    CF-Connecting-IP only for connections that genuinely arrived through
#    the edge. Every Cloudflare-fronted vhost on this box shares it;
#    repeating it per-server would just create a second list to drift.
#
# 2. Refusing to forward the client's own copy of those headers is done in
#    ops/nginx/blog-proxy.conf, included from the `location /` block. That
#    is the half that was missing: real_ip rewrites $remote_addr but leaves
#    the request headers untouched, so CF-Connecting-IP reached the app
#    exactly as the client wrote it.

# The backend (helpers/Security.cc::applySecurityHeaders) already emits this
# exact set. Strip the upstream copies so nginx is the single source of truth
# and the browser never sees duplicate or conflicting policies — and so that
# nginx-generated responses (e.g. the /metrics 404 below) are covered too.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "interest-cohort=(), camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# script-src whitelists 'self', the Umami analytics origin the SPA loads, and
# Cloudflare Browser Insights. style-src keeps 'unsafe-inline' for Vue's
# scoped style injection.
#
# Cloudflare Browser Insights is whitelisted by origin only. That is all it
# needs: the beacon is an external script from static.cloudflareinsights.com
# and it reports to /cdn-cgi/rum on this origin, which 'self' already covers
# — verified as a 200 on the beacon and a 204 on the POST.
#
# One inline script from Cloudflare is still blocked, deliberately. It is
# not Insights; it is the Bot Management JS Detections bootstrap
# (window.__CF$cv$params, /cdn-cgi/challenge-platform/…), and it embeds a
# fresh ray id on every request, so its hash changes on every page load and
# no static hash can ever match it. Allowing it means 'unsafe-inline', which
# would let any injected inline script run and give up most of what this
# header is for. The cost of leaving it blocked is one console error and
# weaker bot fingerprinting; turn JS Detections off in the Cloudflare
# dashboard if that error is not wanted.
#
# Keep this in sync with helpers/Security.cc, which serves the same header
# on paths nginx does not proxy.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; script-src 'self' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://analytics.micutu.com; form-action 'self'; object-src 'none'" always;

# /metrics carries operational telemetry (route counts, latency histograms,
# email queue depth, websocket connection count) — local Prometheus scrape over
# loopback only, never the public edge. The backend also fails closed for
# proxied requests; blocking here makes it unreachable through nginx entirely.
location = /metrics {
    return 404;
}
