# Security configuration for the blog vhost, included from the server block.
# Canonical copy lives here in the repo; deploy with:
#   sudo cp ops/nginx/blog-security.conf /etc/nginx/snippets/blog-security.conf
#   # add `include snippets/blog-security.conf;` inside the 443 server block
#   sudo nginx -t && sudo systemctl reload nginx

# /metrics carries operational telemetry (route counts, latency histograms,
# email queue depth, websocket connection count). It is meant for a local
# Prometheus scrape over loopback (127.0.0.1:8092) only, never for the public
# edge. The backend also fails closed for proxied requests, but blocking here
# means the endpoint is never reachable through Cloudflare/nginx at all.
location = /metrics {
    return 404;
}
