# Edge rate limiting for blog.micutu.com — PREPARED, NOT YET APPLIED.
#
# This is the second layer behind the Cloudflare origin guard (finding #42).
# The guard refuses non-Cloudflare peers; this bounds how fast a peer that IS
# fronted by Cloudflare (or any legitimate-looking flood that reaches the
# origin) can hit us. It exists because the blog vhost — unlike every sibling
# on this host — had no limit_req/limit_conn at all, and because Drogon mints a
# 14-day in-memory session for every cookieless request, so an unthrottled
# request flood is a memory-exhaustion DoS the application cannot damp on its
# own.
#
# The per-endpoint auth limits in helpers/Security.cc are unaffected and remain
# the primary control for /auth/*; this edge layer is about the *aggregate*
# request and connection rate that the app does not cap.
#
# Sizing: $binary_remote_addr is the real visitor here (the host-wide real_ip
# config in cloudflare-realip.conf rewrites it from CF-Connecting-IP before
# these zones are evaluated), so the budgets are per human, not per CF edge.
#   blog_general 600 r/min (10/s) + burst 60 nodelay — a page load fires many
#     API calls; this is generous for browsing yet caps a scraper/flood and,
#     with it, the session-minting rate.
#   blog_conn 32 concurrent connections/IP — well above a browser's handful
#     plus its WebSocket, low enough to stop a single IP hoarding sockets.
#
# ---- HOW TO APPLY ----
#   1. sudo cp ops/nginx/blog-rate-limit.conf /etc/nginx/conf.d/blog-rate-limit.conf
#   2. In the 443 server block of /etc/nginx/sites-enabled/blog.micutu.com,
#      add to `location / { … }` (the proxy_pass location), NOT to /assets/
#      (Cloudflare-cached) or /ws/ (long-lived upgrades):
#          limit_req  zone=blog_general burst=60 nodelay;
#          limit_conn blog_conn 32;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Verify a normal page load still works and that a tight loop eventually
#      gets 429s:  for i in $(seq 1 80); do curl -s -o /dev/null -w '%{http_code} ' \
#                    https://blog.micutu.com/posts; done; echo
#
# Rolling back is a reload away: remove the two lines (or the conf file) and
# reload. Start here and widen only if real traffic ever 429s.

limit_req_zone  $binary_remote_addr zone=blog_general:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

# Answer over-budget requests with 429 (+ Retry-After via the app is not
# involved here; nginx sends a bare 429), not nginx's default 503.
limit_req_status  429;
limit_conn_status 429;
