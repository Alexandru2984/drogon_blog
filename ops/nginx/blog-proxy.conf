# Upstream proxy headers for the blog vhost. Include this INSIDE the
# `location /` block, not at server level:
#
#   location / {
#       proxy_pass http://blog_backend;
#       include snippets/blog-proxy.conf;
#   }
#
# nginx inherits proxy_set_header from an outer level only when the current
# level declares none of its own. A `location` block with even one
# proxy_set_header therefore discards every server-level one silently — which
# is exactly the kind of "config looks right, behaves wrong" failure this file
# exists to avoid. Keeping the whole set in one include makes it impossible to
# have half of it in effect.
#
# Deploy with:
#   sudo cp ops/nginx/blog-proxy.conf /etc/nginx/snippets/blog-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx

proxy_http_version 1.1;
proxy_set_header Connection "";            # required for upstream keepalive

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;

# $remote_addr is authoritative here: blog-security.conf runs the real_ip
# module over Cloudflare's published ranges, so for traffic that genuinely
# arrived through the edge this is the visitor's address, and for anything
# that reached the origin directly it is the true peer. Either way it is
# observed by nginx, never asserted by the client.
proxy_set_header X-Real-IP $remote_addr;

# Deliberately NOT $proxy_add_x_forwarded_for. That variable appends
# $remote_addr to whatever X-Forwarded-For the client already sent, so the
# chain it produces is attacker-prefixed. We originate the chain instead;
# the app has exactly one hop to consider and no parsing to get wrong.
proxy_set_header X-Forwarded-For $remote_addr;

# Blank means "do not pass this header upstream" in nginx.
#
# CF-Connecting-IP is set by Cloudflare and consumed by real_ip above. Once
# it has been consumed, forwarding the client's copy would let anyone who
# reaches the origin directly hand the app an arbitrary client IP — the app
# trusts these headers because its only peer is nginx on loopback, so it
# cannot tell a forged one from a real one. Stripping them here is what makes
# that trust sound. CF-IPCountry and the other CF-* fields are dropped for
# the same reason: nothing upstream reads them today, and a header the app
# might start trusting later should not already be under client control.
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-IPCountry     "";
proxy_set_header CF-Ray           "";
proxy_set_header CF-Visitor       "";
proxy_set_header True-Client-IP   "";
proxy_set_header X-Original-For   "";
proxy_set_header X-Cluster-Client-IP "";
proxy_set_header Forwarded        "";
