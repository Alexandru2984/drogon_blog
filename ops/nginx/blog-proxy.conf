# Upstream proxy headers for ordinary (non-WebSocket) blog requests.
# Include this INSIDE the `location /` block, not at server level:
#
#   location / {
#       proxy_pass http://blog_backend;
#       include snippets/blog-proxy.conf;
#   }
#
# The /ws/ location must include snippets/blog-ws-upgrade.conf INSTEAD of
# this file — never both. nginx appends rather than replaces when the same
# header is set twice at the same level, so including both would send two
# Connection headers upstream. Everything the two have in common lives in
# blog-proxy-common.conf.
#
# Deploy with:
#   sudo cp ops/nginx/blog-proxy.conf /etc/nginx/snippets/blog-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx

proxy_http_version 1.1;
proxy_set_header Connection "";            # required for upstream keepalive

include snippets/blog-proxy-common.conf;
