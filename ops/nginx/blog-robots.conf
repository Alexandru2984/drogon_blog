# robots.txt for the blog vhost. Include INSIDE the 443 server block,
# replacing `include snippets/robots.conf;`.
#
# The shared /var/www/shared/robots.txt is used by every vhost on this host
# and carries the centrally-managed Cloudflare AI-crawler policy, so it is
# deliberately not edited here — a change made for the blog would land on
# all ~36 sites. But it advertises the apex sitemap, which does not list
# any blog posts, so crawlers following it never learn the archive exists.
#
# sub_filter rewrites that one line on the way out for this vhost only.
# The shared file stays the single source of the crawler policy and stays
# centrally updatable; the blog just corrects the sitemap it points at.
#
# Deploy with:
#   sudo cp ops/nginx/blog-robots.conf /etc/nginx/snippets/blog-robots.conf
#   sudo nginx -t && sudo systemctl reload nginx
location = /robots.txt {
    alias /var/www/shared/robots.txt;
    access_log off;
    log_not_found off;

    # alias'd static files are served by the static module, which
    # sub_filter can post-process as long as the type is declared.
    sub_filter_types text/plain;
    sub_filter_once  on;
    sub_filter "Sitemap: https://micutu.com/sitemap.xml"
               "Sitemap: https://blog.micutu.com/sitemap.xml";
}
