# Proxy headers for the blog's WebSocket endpoint.
#
# This is the sibling of blog-proxy.conf. Both include the same
# blog-proxy-common.conf (Host, client-IP, and the CF-* header stripping
# that makes the app's trust in X-Real-IP sound); they differ only in how
# they treat the connection:
#
#   blog-proxy.conf       Connection ""      — required for upstream keep-alive
#   blog-ws-upgrade.conf  Connection upgrade — required for the WS handshake
#
# A location must include exactly ONE of the two, never both. nginx appends
# rather than replaces when the same header is set twice at the same level,
# so including both sends two Connection headers upstream. Splitting the
# shared part into blog-proxy-common.conf is what makes "exactly one" a
# thing you can actually satisfy without duplicating the strip list.
#
# Requires the $blog_connection_upgrade map from conf.d/blog-websocket.conf.
#
# Deploy with:
#   sudo cp ops/nginx/blog-ws-upgrade.conf /etc/nginx/snippets/blog-ws-upgrade.conf
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP/1.0 has no notion of an upgrade, so without this the handshake is
# forwarded as an ordinary GET and Drogon — which knows /ws/messages only
# as a WebSocket path — answers 404.
proxy_http_version 1.1;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $blog_connection_upgrade;

include snippets/blog-proxy-common.conf;

# A WebSocket is idle by design — a chat with nothing being said sends no
# frames. The default 60s proxy_read_timeout tears such a connection down
# and the client reconnect-loops. Ten minutes comfortably outlives any
# application-level ping interval.
proxy_read_timeout  600s;
proxy_send_timeout  600s;

# Response buffering makes no sense for a bidirectional stream and would
# delay frames until a buffer fills.
proxy_buffering off;
