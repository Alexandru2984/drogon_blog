# WebSocket upgrade support for the blog vhost.
#
# WHY THIS FILE EXISTS
#
# snippets/blog-proxy.conf sets `proxy_set_header Connection ""`, which is
# required for upstream keep-alive: nginx must not forward the client's
# `Connection: close` to a pooled upstream connection. That is correct for
# every ordinary request and wrong for exactly one case — the WebSocket
# handshake, which *is* a `Connection: upgrade` request. Blanking the header
# strips the upgrade, Drogon sees a plain GET, and its router — which only
# has /ws/messages registered as a WebSocket path — answers 404.
#
# The visible symptom is that the blog's live features (message delivery,
# live comments on a post) silently never connect: the browser logs a
# WebSocket handshake failure and the UI sits on "○ offline". Nothing else
# breaks, which is why it went unnoticed.
#
# The fix is a separate location for the WebSocket endpoint that forwards
# the upgrade instead of suppressing it. Keep-alive is irrelevant there:
# an upgraded connection is not returned to the pool.
#
# The map is deliberately named with a `blog_` prefix. `map` is only valid
# at http level, so this file lands in conf.d/ where it is shared with every
# other vhost on the host; a generic `$connection_upgrade` would collide the
# moment another site defines its own. Defining a variable nothing else
# references has no effect on any other server block.
#
# Deploy with:
#   sudo cp ops/nginx/blog-websocket.conf /etc/nginx/conf.d/blog-websocket.conf
#   # then add to the blog vhost, INSIDE the 443 server block:
#   #   location /ws/ {
#   #       proxy_pass http://blog_backend;
#   #       include snippets/blog-proxy.conf;
#   #       include snippets/blog-ws-upgrade.conf;
#   #   }
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $blog_connection_upgrade {
    default upgrade;
    ''      close;     # a plain request to /ws/ must not claim to be upgrading
}
