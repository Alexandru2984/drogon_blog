name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + integration tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     blog_user
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB:       blog_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            libdrogon-dev libsodium-dev libcurl4-openssl-dev libssl-dev \
            libbrotli-dev libjsoncpp-dev uuid-dev zlib1g-dev libpq-dev \
            postgresql-client

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run integration tests
        env:
          TEST_DB_HOST:     127.0.0.1
          TEST_DB_PORT:     5432
          TEST_DB_USER:     blog_user
          TEST_DB_PASSWORD: blog_ci_password
          TEST_DB_NAME:     blog_test_db
          TEST_SCHEMA_PATH: ${{ github.workspace }}/schema.sql
        run: ./build/test/blog_test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend_app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (typecheck + bundle)
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: drogon-blog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
