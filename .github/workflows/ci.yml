name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + integration tests)
    runs-on: ubuntu-24.04
    # The official Drogon image carries a pre-built static libdrogon at
    # /usr/local on top of Ubuntu 22.04. We do *not* use apt's libdrogon-dev
    # because the version in Ubuntu noble (1.8.7) is too old for the API we
    # depend on (registerSyncAdvice/HttpResponsePtr return, runOnQuit, …).
    container:
      image: drogonframework/drogon:latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     blog_user
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB:       blog_test_db
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install build-time extras
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libsodium-dev libcurl4-openssl-dev libssl-dev libbrotli-dev \
            libvips-dev \
            libcmark-gfm-dev libcmark-gfm-extensions-dev \
            postgresql-client

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run integration tests
        # When the job runs inside a container, services are reachable by their
        # service name on the bridge network, not via the runner's loopback.
        # test_main.cc drops `public` and re-runs migrations/apply.sh before
        # every test pass — same code path production uses.
        env:
          TEST_DB_HOST:        postgres
          TEST_DB_PORT:        5432
          TEST_DB_USER:        blog_user
          TEST_DB_PASSWORD:    blog_ci_password
          TEST_DB_NAME:        blog_test_db
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: ./build/test/blog_test

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend_app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + bundle)
        run: npm run build

  static-analysis:
    name: Static analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-24.04
    container:
      image: drogonframework/drogon:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libsodium-dev libcurl4-openssl-dev libssl-dev libbrotli-dev \
            libvips-dev \
            libcmark-gfm-dev libcmark-gfm-extensions-dev \
            clang-tidy cppcheck

      - name: Generate compile_commands.json
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: clang-tidy
        run: |
          # The HeaderFilterRegex in .clang-tidy keeps reports limited to our
          # own controllers/ + helpers/ tree. Exit code reflects findings.
          find controllers helpers -name '*.cc' -print0 \
            | xargs -0 clang-tidy -p build --quiet --warnings-as-errors='*'

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppressions-list=.cppcheck-suppress --inline-suppr \
            --error-exitcode=1 --quiet \
            controllers/ helpers/ main.cc

  helm:
    name: Helm chart (lint + template + kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint chart/drogon-blog

      - name: Render & validate (defaults)
        run: |
          helm template ci chart/drogon-blog \
            --set database.password=ci-only-not-real \
            | kubeconform -summary -strict -ignore-missing-schemas \
                          -kubernetes-version 1.30.0

      - name: Render & validate (all opt-ins on)
        # Covers the templates only emitted when their feature flag is
        # set — otherwise lint / kubeconform never sees ingress.yaml,
        # hpa.yaml, servicemonitor.yaml or the metrics secret.
        run: |
          helm template ci chart/drogon-blog \
            --set database.password=ci-only-not-real \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set app.metricsToken=ci-token \
            --set metrics.serviceMonitor.enabled=true \
            | kubeconform -summary -strict -ignore-missing-schemas \
                          -kubernetes-version 1.30.0

  e2e:
    name: E2E (Playwright vs docker-compose)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Bring up the stack
        run: |
          # BLOG_DISABLE_RATE_LIMIT short-circuits the per-IP register / login
          # budget so Playwright can mint a fresh user per spec without 429.
          cat > docker-compose.e2e.yml <<'EOF'
          services:
            app:
              environment:
                BLOG_DISABLE_RATE_LIMIT: "1"
                BLOG_SITE_ORIGIN:        "http://127.0.0.1:8092"
          EOF
          DB_PASSWORD=e2e_db_password \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
                up -d --build
          # Block until /healthz is green or 90 s pass.
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8092/healthz >/dev/null && break || true
            sleep 1
          done
          curl -fsS http://127.0.0.1:8092/healthz

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8092
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  docker:
    name: Docker image build (${{ matrix.arch }})
    # Native runners per arch so we don't pay 5-10× QEMU emulation tax on
    # the Drogon-from-source compile. arm64 runners are free on public
    # repos (github.blog/changelog/2025-01-16…).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   amd64
            runner: ubuntu-24.04
          - arch:   arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: drogon-blog:ci-${{ matrix.arch }}
          # Separate cache scope per arch keeps the two runners from
          # invalidating each other's layers — Drogon's compile output
          # diverges between archs.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to:   type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Smoke-test image binary
        run: |
          # The binary parses config.json before opening any socket, so
          # `--help` exits cleanly without needing a DB. A startup ABI
          # failure (missing .so, unresolved symbol) would surface here.
          docker run --rm --entrypoint /app/blog drogon-blog:ci-${{ matrix.arch }} --help \
            | head -3

  trivy:
    name: Trivy scan (amd64 image)
    runs-on: ubuntu-24.04
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      # Rebuild the amd64 image from the gha cache layer the matrix job
      # warmed up — cheaper than uploading the image as an artifact.
      - name: Materialise amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: drogon-blog:ci
          cache-from: type=gha,scope=docker-amd64

      - name: Trivy scan (image)
        # Upstream switched to a leading `v` for the v0.36.0 tag; the
        # un-prefixed 0.36.0 tag doesn't exist on the repo any more.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:    drogon-blog:ci
          severity:     'HIGH,CRITICAL'
          exit-code:    '1'
          # Don't fail the whole pipeline when the vuln DB itself is
          # unreachable — that's an infra issue, not our code.
          ignore-unfixed: true
          vuln-type:    'os,library'
