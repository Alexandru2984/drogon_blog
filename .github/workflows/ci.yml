name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + integration tests)
    runs-on: ubuntu-24.04
    # The official Drogon image carries a pre-built static libdrogon at
    # /usr/local on top of Ubuntu 22.04. We do *not* use apt's libdrogon-dev
    # because the version in Ubuntu noble (1.8.7) is too old for the API we
    # depend on (registerSyncAdvice/HttpResponsePtr return, runOnQuit, …).
    container:
      image: drogonframework/drogon:latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     blog_user
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB:       blog_test_db
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Install build-time extras
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libsodium-dev libcurl4-openssl-dev libssl-dev libbrotli-dev \
            libvips-dev \
            libcmark-gfm-dev libcmark-gfm-extensions-dev \
            postgresql-client

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run integration tests
        # When the job runs inside a container, services are reachable by their
        # service name on the bridge network, not via the runner's loopback.
        # test_main.cc drops `public` and re-runs migrations/apply.sh before
        # every test pass — same code path production uses.
        env:
          TEST_DB_HOST:        postgres
          TEST_DB_PORT:        5432
          TEST_DB_USER:        blog_user
          TEST_DB_PASSWORD:    blog_ci_password
          TEST_DB_NAME:        blog_test_db
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
        run: ./build/test/blog_test

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend_app

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend_app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Build Storybook
        # Storybook 10 + Vue3 + Vite reuses the project's vite.config.ts.
        # `npm ci` above already pulled `storybook` + `@storybook/vue3-vite`,
        # so this is a pure build step — no extra install.
        run: npm run build-storybook

      - name: Upload Storybook static
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: frontend_app/storybook-static/
          retention-days: 14

  static-analysis:
    name: Static analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-24.04
    container:
      image: drogonframework/drogon:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libsodium-dev libcurl4-openssl-dev libssl-dev libbrotli-dev \
            libvips-dev \
            libcmark-gfm-dev libcmark-gfm-extensions-dev \
            clang-tidy cppcheck

      - name: Generate compile_commands.json
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: clang-tidy
        shell: bash
        run: |
          # The HeaderFilterRegex in .clang-tidy keeps reports limited to our
          # own controllers/ + helpers/ tree. Exit code reflects findings.
          #
          # awk strips clang-tidy's accounting lines ("N warnings generated.",
          # "Suppressed M warnings…", the "Use -header-filter=.* to display"
          # hint). These count warnings the HeaderFilterRegex suppressed from
          # OUTPUT but clang-analyzer still tracked internally — drogon /
          # libpq headers reach into the hundreds of thousands per TU, which
          # produced the 3M-line CI log without buying any signal. The actual
          # tidy diagnostics on our code are still emitted with file:line and
          # are not matched by these filters.
          #
          # -P "$(nproc)" parallelises across cores. clang-tidy is CPU-bound
          # per file, so the speedup scales linearly until we run out of TUs.
          # pipefail preserves clang-tidy's exit code through the awk filter.
          # controllers/grpc/ is excluded because its sources include
          # the protoc-generated `blog.grpc.pb.h` from build/proto/,
          # and clang-tidy without a compile-commands entry can't
          # resolve that header (the build dir uses add_custom_command,
          # not a target the static-analysis CMake configures). The
          # service impl is exercised end-to-end via grpcurl smoke and
          # the BlogReader gRPC roundtrip — not via clang-tidy.
          set -o pipefail
          # `find` here starts at `controllers/` + `helpers/`, so the
          # printed paths begin with those dirs directly — the prune
          # path needs to be `controllers/grpc` without a leading
          # wildcard, otherwise the match never fires.
          find controllers helpers -path 'controllers/grpc' -prune -o -name '*.cc' -print0 \
            | xargs -0 -P "$(nproc)" -n 1 clang-tidy -p build --quiet --warnings-as-errors='*' 2>&1 \
            | awk '!/^[0-9]+ warnings generated\.$/ && \
                   !/^Suppressed [0-9]+ warnings / && \
                   !/^Use -header-filter=/'

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppressions-list=.cppcheck-suppress --inline-suppr \
            --error-exitcode=1 --quiet \
            controllers/ helpers/ main.cc

  openapi:
    name: OpenAPI lint (spectral)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: spectral lint
        # @stoplight/spectral-cli pinned to a known-good major. We use
        # npx --package so the version is captured in the CI log and
        # doesn't drift silently against npm's "latest" pointer.
        run: |
          npx --yes --package=@stoplight/spectral-cli@6.15.0 \
              spectral lint openapi/blog.openapi.yaml --ruleset .spectral.yaml \
              --fail-severity=error

  backup-restore:
    name: Backup → restore round-trip
    runs-on: ubuntu-24.04
    # postgresql-client + bash are all we need; reuse a stock postgres image
    # as the runner-side toolchain rather than installing packages by hand.
    container:
      image: postgres:17-alpine
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     blog_user
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB:       blog_db
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST:     postgres
      DB_PORT:     "5432"
      DB_USER:     blog_user
      DB_PASSWORD: blog_ci_password
      DB_NAME:     blog_db
    steps:
      - uses: actions/checkout@v6

      - name: Tooling
        run: apk add --no-cache bash coreutils findutils

      - name: Apply migrations
        run: bash migrations/apply.sh

      - name: Seed sample data
        # A few rows in each user-facing table so the restore has
        # something to verify beyond schema parity. The deterministic
        # values let the post-restore assertions compare exact rows.
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (username, email, password_hash, email_verified)
          VALUES ('alice', 'alice@example.test', 'fakehash', 1),
                 ('bob',   'bob@example.test',   'fakehash', 1);
          INSERT INTO posts (user_id, title, content)
          SELECT id, 'first', 'hello world' FROM users WHERE username='alice';
          INSERT INTO comments (post_id, user_id, content)
          SELECT p.id, u.id, 'nice post'
          FROM posts p, users u
          WHERE u.username = 'bob';
          SQL

      - name: Backup
        run: BLOG_BACKUP_DIR=/tmp/dr bash scripts/backup.sh

      - name: Wipe DB
        # Drop & recreate the public schema — the same shape restore.sh
        # is exercised against on prod (empty target, restore --no-force).
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
               -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Restore
        # Use the newest .dump in /tmp/dr (there's exactly one in CI, but
        # the glob protects us if we ever add seed-after-backup steps).
        run: |
          dump=$(ls -1t /tmp/dr/blog-*.dump | head -n 1)
          bash scripts/restore.sh "$dump"

      - name: Verify round-trip
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            u_count int; p_count int; c_count int; m_count int;
          BEGIN
            SELECT count(*) INTO u_count FROM users;
            SELECT count(*) INTO p_count FROM posts;
            SELECT count(*) INTO c_count FROM comments;
            SELECT count(*) INTO m_count FROM applied_migrations;

            IF u_count <> 2 OR p_count <> 1 OR c_count <> 1 OR m_count = 0 THEN
              RAISE EXCEPTION
                'restored row counts off: users=% posts=% comments=% migrations=%',
                u_count, p_count, c_count, m_count;
            END IF;
            PERFORM 1 FROM users WHERE username='alice' AND email='alice@example.test';
            IF NOT FOUND THEN
              RAISE EXCEPTION 'restored user alice missing or wrong email';
            END IF;
          END $$;
          SQL

  helm:
    name: Helm chart (lint + template + kubeconform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint chart/drogon-blog

      - name: Render & validate (defaults)
        run: |
          helm template ci chart/drogon-blog \
            --set database.password=ci-only-not-real \
            | kubeconform -summary -strict -ignore-missing-schemas \
                          -kubernetes-version 1.30.0

      - name: Render & validate (all opt-ins on)
        # Covers the templates only emitted when their feature flag is
        # set — otherwise lint / kubeconform never sees ingress.yaml,
        # hpa.yaml, servicemonitor.yaml, the metrics secret, the
        # pgbouncer sidecar container, or the CNPG Cluster CR.
        # -ignore-missing-schemas is essential because the CNPG
        # Cluster CR is a CRD that kubeconform's bundled schemas
        # don't cover — we accept "I can't check this one" rather
        # than fetching the CRD schema in CI.
        run: |
          helm template ci chart/drogon-blog \
            --set database.password=ci-only-not-real \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set app.metricsToken=ci-token \
            --set metrics.serviceMonitor.enabled=true \
            --set pgbouncer.enabled=true \
            --set cnpg.enabled=true \
            | kubeconform -summary -strict -ignore-missing-schemas \
                          -kubernetes-version 1.30.0

  e2e:
    name: E2E (Playwright vs docker-compose)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Bring up the stack
        run: |
          # BLOG_DISABLE_RATE_LIMIT short-circuits the per-IP register / login
          # budget so Playwright can mint a fresh user per spec without 429.
          #
          # The DB is also exposed on host port 55432 so the password-reset
          # spec can plant a known reset token directly (the SHA-256 in DB
          # is one-way and EmailHelper isn't wired in CI). Same channel
          # used by the WS spec to look up Bob's user id.
          # BLOG_SITE_ORIGIN uses localhost (not 127.0.0.1) so the
          # WebAuthn specs can register passkeys: Chromium's WebAuthn
          # rejects bare IPs as RP IDs (must be a valid domain string);
          # `localhost` is the spec-blessed dev exception. Playwright's
          # baseURL below switches to the same hostname so the Origin
          # header matches.
          cat > docker-compose.e2e.yml <<'EOF'
          services:
            app:
              environment:
                BLOG_DISABLE_RATE_LIMIT: "1"
                BLOG_SITE_ORIGIN:        "http://localhost:8092"
            db:
              ports:
                - "55432:5432"
          EOF
          DB_PASSWORD=e2e_db_password \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
                up -d --build
          # Block until /healthz is green or 90 s pass.
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8092/healthz >/dev/null && break || true
            sleep 1
          done
          curl -fsS http://127.0.0.1:8092/healthz

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL:    http://localhost:8092
          E2E_DB_HOST:     127.0.0.1
          E2E_DB_PORT:     "55432"
          E2E_DB_USER:     blog_user
          E2E_DB_PASSWORD: e2e_db_password
          E2E_DB_NAME:     blog_db
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  perf-regression:
    name: Perf regression (k6)
    runs-on: ubuntu-24.04
    needs: [backend]
    # The job exists to catch order-of-magnitude regressions, not to
    # benchmark prod. STRICT_THRESHOLDS in bench/scenarios.js are sized
    # for the ubuntu-24.04 4-vCPU runner; bumping the runner class
    # warrants a paired bump in those thresholds. See bench/README.md.
    steps:
      - uses: actions/checkout@v6

      - name: Bring up the stack
        run: |
          # Same docker-compose override as the e2e job — rate limiter
          # off so the bench's 20 VUs hammering /posts don't 429 each
          # other. No DB port export needed here.
          cat > docker-compose.perf.yml <<'EOF'
          services:
            app:
              environment:
                BLOG_DISABLE_RATE_LIMIT: "1"
                BLOG_SITE_ORIGIN:        "http://127.0.0.1:8092"
          EOF
          DB_PASSWORD=perf_db_password \
            docker compose -f docker-compose.yml -f docker-compose.perf.yml \
                up -d --build
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8092/healthz >/dev/null && break || true
            sleep 1
          done
          curl -fsS http://127.0.0.1:8092/healthz

      - name: Install k6
        run: |
          # grafana/k6 official apt repo. v0.55 is the current stable.
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y -qq k6
          k6 version

      - name: Seed bench data
        run: |
          # bench/seed.py writes bench/seed.json which the k6 scenarios
          # mmap at init time. Idempotent — re-runs reset to a known
          # corpus.
          python3 bench/seed.py --base http://127.0.0.1:8092

      - name: k6 — feed_read (strict)
        run: |
          # Each scenario runs as its own k6 invocation: thresholds in
          # scenarios.js are flat (no tag scoping) and apply to the
          # whole run. 20s is enough to fill the latency histograms
          # past the variance floor while keeping total job time short.
          K6_STRICT=1 k6 run \
              -e SCENARIO=feed_read -e BASE_URL=http://127.0.0.1:8092 \
              --vus 20 --duration 20s \
              --summary-export bench/results-ci/feed_read.json \
              bench/scenarios.js

      - name: k6 — post_view (strict)
        run: |
          K6_STRICT=1 k6 run \
              -e SCENARIO=post_view -e BASE_URL=http://127.0.0.1:8092 \
              --vus 20 --duration 20s \
              --summary-export bench/results-ci/post_view.json \
              bench/scenarios.js

      - name: k6 — search (strict)
        run: |
          K6_STRICT=1 k6 run \
              -e SCENARIO=search -e BASE_URL=http://127.0.0.1:8092 \
              --vus 10 --duration 20s \
              --summary-export bench/results-ci/search.json \
              bench/scenarios.js

      - name: Upload k6 summaries on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summaries
          path: bench/results-ci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.perf.yml down -v

  docker:
    name: Docker image build (${{ matrix.arch }})
    # Native runners per arch so we don't pay 5-10× QEMU emulation tax on
    # the Drogon-from-source compile. arm64 runners are free on public
    # repos (github.blog/changelog/2025-01-16…).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:   amd64
            runner: ubuntu-24.04
          - arch:   arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: drogon-blog:ci-${{ matrix.arch }}
          # Separate cache scope per arch keeps the two runners from
          # invalidating each other's layers — Drogon's compile output
          # diverges between archs.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to:   type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Smoke-test image binary
        run: |
          # The binary parses config.json before opening any socket, so
          # `--help` exits cleanly without needing a DB. A startup ABI
          # failure (missing .so, unresolved symbol) would surface here.
          docker run --rm --entrypoint /app/blog drogon-blog:ci-${{ matrix.arch }} --help \
            | head -3

  trivy:
    name: Trivy scan (amd64 image)
    runs-on: ubuntu-24.04
    needs: docker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      # Rebuild the amd64 image from the gha cache layer the matrix job
      # warmed up — cheaper than uploading the image as an artifact.
      - name: Materialise amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: drogon-blog:ci
          cache-from: type=gha,scope=docker-amd64

      - name: Trivy scan (image)
        # Upstream switched to a leading `v` for the v0.36.0 tag; the
        # un-prefixed 0.36.0 tag doesn't exist on the repo any more.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:    drogon-blog:ci
          severity:     'HIGH,CRITICAL'
          exit-code:    '1'
          # Don't fail the whole pipeline when the vuln DB itself is
          # unreachable — that's an infra issue, not our code.
          ignore-unfixed: true
          vuln-type:    'os,library'
          # Base-image CVE allowlist (with expiries) — see .trivyignore.
          trivyignores: .trivyignore

  sanitizers:
    name: Backend (ASan + UBSan)
    runs-on: ubuntu-24.04
    container:
      image: drogonframework/drogon:latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER:     blog_user
          POSTGRES_PASSWORD: blog_ci_password
          POSTGRES_DB:       blog_test_db
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: Install build-time extras
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libsodium-dev libcurl4-openssl-dev libssl-dev libbrotli-dev \
            libvips-dev \
            libcmark-gfm-dev libcmark-gfm-extensions-dev \
            postgresql-client

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build tests
        run: cmake --build build-san -j"$(nproc)"

      - name: Run integration tests under sanitizers
        env:
          TEST_DB_HOST:        postgres
          TEST_DB_PORT:        "5432"
          TEST_DB_USER:        blog_user
          TEST_DB_PASSWORD:    blog_ci_password
          TEST_DB_NAME:        blog_test_db
          TEST_MIGRATIONS_DIR: ${{ github.workspace }}/migrations
          # Leak detection off: libdrogon / libpq keep intentional
          # process-lifetime globals LSan would flag. We're after
          # use-after-free / OOB / UB, which ASan+UBSan still catch.
          ASAN_OPTIONS:  "detect_leaks=0:abort_on_error=1:strict_string_checks=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ./build-san/test/blog_test

  secrets-and-deps:
    name: Secret + dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # gitleaks walks the full history

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: osv-scanner (JS dependency CVEs)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan --lockfile=/src/frontend_app/package-lock.json \
                 --lockfile=/src/e2e/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend_app
        run: npm audit --audit-level=high

      - name: npm audit (e2e)
        working-directory: e2e
        run: npm audit --audit-level=high
