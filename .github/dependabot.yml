version: 2
updates:
  # Frontend SPA — Vue 3 + Vite + Pinia stack.
  - package-ecosystem: "npm"
    directory:         "/frontend_app"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      vue:        { patterns: ["vue", "vue-router", "pinia", "@vitejs/*", "vite", "vue-tsc"] }
      types:      { patterns: ["@types/*", "typescript"] }

  # End-to-end test harness — Playwright + TS.
  - package-ecosystem: "npm"
    directory:         "/e2e"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3

  # CI itself.
  - package-ecosystem: "github-actions"
    directory:         "/"
    schedule: { interval: "weekly" }

  # Docker base images — picks up CVE-fix releases for ubuntu / postgres /
  # node / drogonframework/drogon.
  #
  # ubuntu MAJOR bumps are deliberately blocked: the runtime stage must stay
  # binary-compatible with the build base (drogonframework/drogon:latest =
  # Ubuntu 22.04). cmark-gfm rev-bumps its SONAME each Ubuntu release
  # (22.04 → libcmark-gfm0.29.0.gfm.3, 24.04 → .gfm.6, 26.04 → .gfm.13), so
  # a runtime-only bump breaks dynamic linking. Drop the ignore and bump
  # both stages together once upstream Drogon ships a newer Ubuntu base.
  - package-ecosystem: "docker"
    directory:         "/"
    schedule: { interval: "weekly" }
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
