version: 2
updates:
  # Frontend SPA — Vue 3 + Vite + Pinia stack.
  - package-ecosystem: "npm"
    directory:         "/frontend_app"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      vue:        { patterns: ["vue", "vue-router", "pinia", "@vitejs/*", "vite", "vue-tsc"] }
      types:      { patterns: ["@types/*", "typescript"] }
    # TypeScript majors are gated on the lint toolchain, not on us.
    # typescript-eslint declares `typescript ">=4.8.4 <6.1.0"` and still does
    # as of 8.66.0, its latest, so TypeScript 7 installs fine and then breaks
    # `npm run lint` — a required check. Dependabot proposed it as #43, had it
    # closed, and recreated the impossible half as #44 within the minute; left
    # alone it would keep doing that every week.
    #
    # Minor and patch updates still flow. Drop this entry once
    # typescript-eslint widens its peer range.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # End-to-end test harness — Playwright + TS.
  - package-ecosystem: "npm"
    directory:         "/e2e"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 3

  # CI itself.
  - package-ecosystem: "github-actions"
    directory:         "/"
    schedule: { interval: "weekly" }

  # Docker base images — picks up CVE-fix releases for ubuntu / postgres /
  # node / drogonframework/drogon.
  #
  # ubuntu version bumps are deliberately blocked; only digest updates (CVE
  # rebuilds of the same tag) flow through. Minor bumps land on non-LTS
  # releases (24.04 → 24.10) whose apt archives vanish at EOL, and an
  # LTS-to-LTS jump must move all three stages together by hand anyway:
  # cmark-gfm rev-bumps its SONAME each Ubuntu release (22.04 →
  # libcmark-gfm0.29.0.gfm.3, 24.04 → .gfm.6, 26.04 → .gfm.13) and noble's
  # time64 transition renamed runtime packages (libssl3 → libssl3t64, …).
  - package-ecosystem: "docker"
    directory:         "/"
    schedule: { interval: "weekly" }
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
