{{- if .Values.cnpg.enabled }}
{{- /*
App-side Secret pointing at the CNPG-generated credentials.

CNPG can be told to bootstrap with a pre-seeded password via
bootstrap.initdb.secret. We own that Secret here so we can mirror
the same value the rest of the chart consumes through
.Values.database.password (or, if the user already overrode that,
just pass theirs through). End result: the app pod's existing
DB_PASSWORD env wiring stays oblivious to who's providing the DB.

Caveat on `randAlphaNum`: changes across `helm upgrade` invocations
unless .Values.database.password is set. CNPG only reads the Secret
during initdb bootstrap (first install), so a re-randomized password
on later upgrades silently diverges from the actual cluster password.
For anything beyond local dev: set .Values.database.password yourself
so this Secret is stable.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drogon-blog.fullname" . }}-cnpg-app
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ default (randAlphaNum 24) .Values.database.password | quote }}
{{- end }}
