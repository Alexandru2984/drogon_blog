{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drogon-blog.serviceAccountName" . }}
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# token automount: the app doesn't talk to the Kubernetes API, so we
# turn off the in-pod token mount to remove a stray credential surface.
automountServiceAccountToken: false
{{- end }}
