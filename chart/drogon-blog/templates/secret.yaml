{{- /*
Only template a DB Secret when the caller did not provide an
existingSecret. Same shape for SMTP and METRICS_TOKEN. We never
default-generate a random password — silent randomisation on
upgrade would orphan the running app from its data.
*/ -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drogon-blog.dbSecretName" . }}
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "database.password is required when database.existingSecret is not set" .Values.database.password | quote }}
{{- end }}
---
{{- if and (not .Values.smtp.existingSecret) .Values.smtp.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drogon-blog.smtpSecretName" . }}
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
type: Opaque
stringData:
  smtp_password: {{ .Values.smtp.password | quote }}
{{- end }}
---
{{- if .Values.app.metricsToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drogon-blog.fullname" . }}-metrics
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
type: Opaque
stringData:
  METRICS_TOKEN: {{ .Values.app.metricsToken | quote }}
{{- end }}
