{{- if and .Values.totp.encryptionKey .Values.totp.existingSecret -}}
{{- fail "set only one of totp.encryptionKey or totp.existingSecret" -}}
{{- end -}}
{{- if and .Values.totp.encryptionKey (not (regexMatch "^[0-9A-Fa-f]{64}$" .Values.totp.encryptionKey)) -}}
{{- fail "totp.encryptionKey must contain exactly 64 hexadecimal characters" -}}
{{- end -}}
{{- if and .Values.app.secureCookies (not (or .Values.totp.encryptionKey .Values.totp.existingSecret)) -}}
{{- fail "totp.encryptionKey or totp.existingSecret is required when app.secureCookies=true" -}}
{{- end -}}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "replicaCount must be 1: Drogon sessions and security rate limits are process-local" -}}
{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- fail "autoscaling is unsupported until sessions and security rate limits use distributed stores" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drogon-blog.fullname" . }}
  labels: {{- include "drogon-blog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "drogon-blog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "drogon-blog.labels" . | nindent 8 }}
      annotations:
        # Force pod rotation whenever the env config changes — helm
        # otherwise keeps the same pod template hash and the change
        # doesn't propagate until you bounce the deployment manually.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml")    . | sha256sum }}
    spec:
      serviceAccountName: {{ include "drogon-blog.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: blog
          image: {{ include "drogon-blog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "drogon-blog.fullname" . }}-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drogon-blog.dbSecretName" . }}
                  key:  {{ include "drogon-blog.dbSecretKey"  . }}
            {{- if or .Values.smtp.existingSecret .Values.smtp.password }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drogon-blog.smtpSecretName" . }}
                  key:  {{ include "drogon-blog.smtpSecretKey"  . }}
            {{- end }}
            {{- if or .Values.totp.existingSecret .Values.totp.encryptionKey }}
            - name: BLOG_TOTP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "drogon-blog.totpSecretName" . }}
                  key:  {{ include "drogon-blog.totpSecretKey"  . }}
            {{- end }}
            {{- if .Values.app.metricsToken }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "drogon-blog.fullname" . }}-metrics
                  key:  METRICS_TOKEN
            {{- end }}
          # /uploads is the only writable path the app needs; mount an
          # emptyDir there so the rest of the filesystem can be made
          # read-only when the user opts in via containerSecurityContext.
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:  {{- toYaml .Values.probes.liveness  | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                # K8s removes the pod from Service endpoints the moment
                # it begins termination, but kube-proxy + the upstream
                # LB take a few seconds to propagate that change. Sleep
                # here keeps the container in a "still serving" state
                # for long enough that no fresh request hits us with a
                # stale endpoint cache. SIGTERM is sent AFTER preStop
                # completes; the app's own handler then flips /readyz
                # to 503 and drains in-flight work (see main.cc).
                command: ["/bin/sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
        {{- if .Values.pgbouncer.enabled }}
        # PgBouncer sidecar. Pools app-side queries onto a bounded set
        # of connections to the upstream Postgres so a worker-pool burst
        # doesn't run PG's max_connections cap. The
        # app talks to this container on 127.0.0.1:6432 (see the
        # appDbHost/Port helpers + configmap.yaml).
        #
        # bitnami/pgbouncer is env-driven — no ConfigMap mount needed
        # for the standard pooling setup. POSTGRESQL_* configure the
        # upstream connection; PGBOUNCER_* configure the listen side.
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          ports:
            - name: bouncer
              containerPort: 6432
              protocol: TCP
          env:
            - name: POSTGRESQL_HOST
              value: {{ include "drogon-blog.upstreamDbHost" . | quote }}
            - name: POSTGRESQL_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRESQL_USERNAME
              value: {{ .Values.database.user | quote }}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drogon-blog.dbSecretName" . }}
                  key:  {{ include "drogon-blog.dbSecretKey"  . }}
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGBOUNCER_DATABASE
              # `*` exposes every upstream DB on the listener so the
              # app's DB_NAME passes through without an explicit
              # per-database stanza. Bitnami's launcher generates the
              # [databases] section from this.
              value: "*"
            - name: PGBOUNCER_PORT
              value: "6432"
            - name: PGBOUNCER_BIND_ADDR
              value: "127.0.0.1"
            - name: PGBOUNCER_POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.poolSize | quote }}
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClient | quote }}
            # Skip the `extra_float_digits` startup parameter — Drogon's
            # libpq client emits it and pgbouncer rejects unknown
            # startup params in transaction pool mode unless told to
            # ignore them.
            - name: PGBOUNCER_IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits"
          resources: {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: bouncer
            initialDelaySeconds: 5
            periodSeconds:       10
        {{- end }}
      # terminationGracePeriodSeconds caps the total shutdown window:
      # preStop sleep + SIGTERM drain. Tuned to comfortably exceed the
      # 2 s drain sleep + a slow in-flight DB query without leaving the
      # rolling deploy hanging.
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      volumes:
        - name: uploads
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
