apiVersion: v2
name: drogon-blog
description: |
  Drogon (C++20) blog with PostgreSQL backend, Argon2id auth, TOTP +
  WebAuthn 2FA, weak-ETag conditional GETs and OTLP-shaped tracing.
  Image is multi-arch (linux/amd64, linux/arm64).
type: application
