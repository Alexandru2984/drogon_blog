# Default values for drogon-blog.
# Override per install with `-f my-values.yaml` or `--set key=value`.

image:
  repository: ghcr.io/alexandru2984/drogon-blog
  # Override with an explicit immutable tag per deploy. `latest` is OK
  # for dev clusters; production deploys should pin a digest or a tag.
  tag: ""              # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Pod replicas. HPA (below) takes precedence when enabled.
replicaCount: 2

# Names. `nameOverride` swaps the chart name; `fullnameOverride`
# replaces the whole release-prefixed name. Both empty → use the
# release name + chart name combo from _helpers.tpl.
nameOverride:     ""
fullnameOverride: ""

serviceAccount:
  create: true
  name:   ""
  annotations: {}

# ------------------------------------------------------------------
# Database
# ------------------------------------------------------------------
# This chart assumes an EXTERNAL Postgres (managed RDS / CNPG / etc).
# Wire your DB by setting `database.host` and either inlining the
# password under `database.password` (it gets templated into a Secret)
# or pointing `database.existingSecret` at one you manage yourself —
# strongly preferred so a `helm get values` doesn't leak it.
database:
  host:     "postgres"
  port:     5432
  name:     "blog_db"
  user:     "blog_user"
  password: ""           # raw secret value — avoid in prod, use existingSecret
  existingSecret:    ""  # name of a k8s Secret in the same namespace
  existingSecretKey: "password"

# ------------------------------------------------------------------
# PgBouncer sidecar
# ------------------------------------------------------------------
# When enabled, a `pgbouncer` container is added to the app pod and
# the app talks to it on 127.0.0.1:6432 instead of the upstream DB
# directly. PgBouncer pools connections to the actual Postgres
# (.Values.database.host), so the per-pod connection count to PG
# stays bounded even if the app spikes thread-pool concurrency
# (Drogon's worker pool, large bench bursts, etc.).
#
# Trade-off: an extra hop per query (loopback, ~50µs). Worth it once
# you have >1 app replica or burst load that would otherwise overshoot
# PG's max_connections; for a single replica it's marginal.
#
# Defaults are sized for a 1-2 CPU pod hitting a 100-connection PG
# cap with a couple of replicas — bump pool_size if you scale out.
pgbouncer:
  enabled: false
  image:
    repository: bitnami/pgbouncer
    tag:        "1.23.1"
    pullPolicy: IfNotPresent
  poolMode:    "transaction"   # transaction|session|statement
  poolSize:    20               # per-pool connections to PG
  maxClient:   200              # client-side connection cap
  resources:
    requests: { cpu: "50m",  memory: "32Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }

# ------------------------------------------------------------------
# CloudNativePG (CNPG) optional dependency
# ------------------------------------------------------------------
# OFF by default. Real prod deployments use an externally-managed
# Postgres (managed RDS, an existing in-cluster cluster, etc.).
# Turning this on installs a single-instance Cluster CR via the
# cloudnative-pg/cluster sub-chart — convenient for dev clusters
# where "helm install + done" is the goal, but not what you want in
# production (you'd want a real backup story, replicas, monitoring).
#
# Note: the CNPG OPERATOR itself must already be installed in the
# cluster. This chart only declares a Cluster CR — it doesn't bring
# the operator with it. See cloudnative-pg.io for the operator's
# install instructions.
#
# When enabled, this chart also rewrites .Values.database.host to
# the CNPG-managed Service name in the templates that read it.
cnpg:
  enabled:    false
  instances:  1
  storage:    "5Gi"
  # Image override is rarely needed; CNPG ships matching PG images.
  imageName:  ""

# ------------------------------------------------------------------
# Redis (optional, presence tracker)
# ------------------------------------------------------------------
# When `url` is non-empty, the app connects on startup and tracks
# WebSocket-online users in a shared Redis (SETEX user:N:online TTL).
# /users/{id} surfaces an `online: true` field for active users.
#
# Useful once you scale past one app pod — pg_notify already fans
# out new messages across pods, but "is user N online globally?"
# needs a shared store. Leave empty for single-pod deployments.
#
# Production note: the binary needs to be built with libhiredis-dev
# (the Dockerfile does this; bare-metal builds may not). When the
# build lacks hiredis, BLOG_REDIS_URL is ignored and helpers/Presence
# helpers no-op silently.
redis:
  url: ""   # e.g. "redis://blog-redis:6379" or "unix:///var/run/redis.sock"

# ------------------------------------------------------------------
# Sentry / Glitchtip (optional, error tracking)
# ------------------------------------------------------------------
# Backend (`dsn`): consumed by helpers/Sentry as BLOG_SENTRY_DSN.
# When a request errors out (5xx), a single fire-and-forget POST to
# the legacy `/api/<project>/store/` ingest endpoint ships request
# context (route, method, status, request-id, trace-id). No stack
# traces — the backend doesn't carry exception-aware instrumentation,
# and shipping bodies would risk PII / credential leaks.
#
# Frontend (`frontendDsn`): if you also want browser-side errors
# captured, pass this DSN as VITE_SENTRY_DSN at FRONTEND BUILD TIME
# (not runtime — Vite inlines env vars at build). The Helm chart
# only surfaces it for documentation; baking it into a runtime
# config requires a small bootstrap shim that's intentionally out
# of scope for this chart.
#
# Both DSNs are inert when empty. Glitchtip works with the same
# format and the same endpoints.
sentry:
  dsn:         ""   # backend, e.g. https://abc@o123.ingest.sentry.io/42
  frontendDsn: ""   # build-time pass-through for the SPA

# ------------------------------------------------------------------
# gRPC server (optional, read-only)
# ------------------------------------------------------------------
# Bolts a BlogReader gRPC service onto a second port alongside the
# REST listener. Read-only by design (GetPost, ListPosts) so we don't
# duplicate the auth + CSRF + rate-limit plumbing onto a second
# surface; mutating ops stay on REST.
#
# Build-time gate: the binary needs to be linked with libgrpc++-dev +
# protobuf-compiler[-grpc] (the Dockerfile installs both; bare-metal
# builds may not). When unavailable, BLOG_GRPC_PORT is ignored and
# helpers/GrpcServer compiles to a stub.
grpc:
  enabled: false
  port:    8093

# ------------------------------------------------------------------
# SMTP
# ------------------------------------------------------------------
# Leave server empty to disable real delivery (emails logged + dropped
# by EmailHelper — useful for local clusters and CI runs).
smtp:
  server:    ""
  username:  ""
  password:  ""
  fromEmail: "noreply@example.com"
  fromName:  "Drogon Blog"
  existingSecret:    ""    # if set, overrides .password
  existingSecretKey: "smtp_password"

# ------------------------------------------------------------------
# Application config (BLOG_* env vars)
# ------------------------------------------------------------------
app:
  # Origin used in WebAuthn RP id derivation, email links, CSRF
  # SameSite enforcement. Must match how clients reach the app
  # (typically the public ingress URL).
  siteOrigin:    "https://blog.example.com"
  siteName:     "Drogon Blog"
  serviceName:  "drogon-blog"
  # 1 → Set-Cookie ... Secure. Required when siteOrigin is https://.
  secureCookies: true
  # OTLP-style trace JSON on stderr (sampled). 0.0–1.0.
  traceLog:        false
  traceSampleRate: "0.0"
  # WebAuthn RP id. Empty → derived from siteOrigin host. Override
  # only when you need a parent domain RP id (apex covering subs).
  webauthnRpId: ""
  # Bypass per-IP token buckets on /auth/*. Only safe for benchmarks
  # behind a closed network — never enable in production.
  disableRateLimit: false
  # Bearer token gating /metrics for off-loopback peers. When empty,
  # /metrics returns 403 to any non-loopback client.
  metricsToken: ""

# ------------------------------------------------------------------
# Service
# ------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8092

# ------------------------------------------------------------------
# Ingress (off by default — chart works on a flat cluster without one)
# ------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: blog.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: blog-tls
  #   hosts: [blog.example.com]

# ------------------------------------------------------------------
# Resources
# ------------------------------------------------------------------
# The empty default lets the cluster auto-allocate; production should
# always set both requests and limits. Numbers below are a reasonable
# starting point for a small blog under burst load.
resources: {}
  # requests:
  #   cpu:    "200m"
  #   memory: "256Mi"
  # limits:
  #   cpu:    "1000m"
  #   memory: "512Mi"

# ------------------------------------------------------------------
# Autoscaler
# ------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ------------------------------------------------------------------
# Prometheus operator integration (ServiceMonitor)
# ------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Bearer used by Prometheus when scraping /metrics. Should match
    # app.metricsToken; if set here, a Secret holds it and SM uses
    # bearerTokenSecret to inject. Leaving both empty makes /metrics
    # loopback-only — pointless in a Service-routed cluster, so the
    # SM template requires one of them.
    bearerToken: ""

# ------------------------------------------------------------------
# Pod scheduling / hardening
# ------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser:    1000
  runAsGroup:   1000
  fsGroup:      1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem:   false   # /app/uploads needs write
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations:  []
affinity:     {}

# ------------------------------------------------------------------
# Probes (paths match Drogon's helpers/Ops.cc handlers)
# ------------------------------------------------------------------
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds:       20
    timeoutSeconds:      3
    failureThreshold:    3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds:       10
    timeoutSeconds:      3
    failureThreshold:    3

# ------------------------------------------------------------------
# Graceful shutdown
# ------------------------------------------------------------------
# Total window = preStopSleepSeconds + the app-side SIGTERM drain
# (2 s LB-notice sleep + WS close + in-flight HTTP drain, see main.cc).
# Bump preStopSleepSeconds if the LB endpoint sync is slow on your
# cluster (Cloud LBs sometimes need 10–20 s before they stop sending).
lifecycle:
  preStopSleepSeconds:            8
  terminationGracePeriodSeconds: 30
